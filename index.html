<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translate API</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#f2f4f8}
main{max-width:820px;margin:0 auto;padding:32px 16px 48px}h1{font-size:28px;margin:0 0 6px}p.sub{color:#9aa4b2;margin:0 0 24px}
.card{background:#171a21;border:1px solid #262b36;border-radius:16px;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}.field{flex:1;min-width:140px}
label{display:block;font-size:13px;color:#9aa4b2;margin-bottom:6px}
select,textarea,button{width:100%;border-radius:10px;border:1px solid #2c333f;background:#0f1115;color:#f2f4f8;padding:12px;font-size:15px}
textarea{min-height:130px;resize:vertical}button{background:#2563eb;border-color:#2563eb;font-weight:600;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
.out{white-space:pre-wrap;word-break:break-word;background:#0f1115;border:1px solid #2c333f;border-radius:10px;padding:12px;min-height:130px}
.err{color:#f87171;font-size:14px;min-height:20px;margin-top:10px}code{background:#262b36;padding:2px 6px;border-radius:6px}
.docs{margin-top:24px;color:#9aa4b2;font-size:14px;line-height:1.9}
</style>
</head>
<body>
<main>
<h1>Translate API</h1>
<p class="sub">Free translation powered by DeepL, ChatGPT Translate and Google Translate, no API key needed</p>
<div class="card">
<div class="row">
<div class="field"><label>Engine</label><select id="engine"><option value="deepl">DeepL</option><option value="openai">ChatGPT Translate</option><option value="google">Google Translate</option></select></div>
<div class="field"><label>From</label><select id="source"><option value="auto">Auto detect</option><option value="en">English</option><option value="ar">Arabic</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option><option value="it">Italian</option><option value="pt">Portuguese</option><option value="ru">Russian</option><option value="zh">Chinese</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="tr">Turkish</option></select></div>
<div class="field"><label>To</label><select id="target"><option value="ar">Arabic</option><option value="en">English</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option><option value="it">Italian</option><option value="pt">Portuguese</option><option value="ru">Russian</option><option value="zh">Chinese</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="tr">Turkish</option></select></div>
</div>
<div class="row"><div class="field"><label>Text</label><textarea id="text" placeholder="Type text to translate"></textarea></div></div>
<div class="row"><div class="field"><label>Translation</label><div class="out" id="output"></div></div></div>
<button id="go">Translate</button>
<div class="err" id="err"></div>
</div>
<div class="docs">
API<br>
<code>POST /api/translate</code> with <code>{"text":"Hello","target":"ar","source":"auto","engine":"deepl"}</code><br>
<code>POST /api/detect</code> with <code>{"text":"Bonjour"}</code><br>
<code>GET /api/languages</code> and <code>GET /api/health</code>
</div>
</main>
<script>
const go=document.getElementById('go'),out=document.getElementById('output'),err=document.getElementById('err');
go.onclick=async()=>{err.textContent='';out.textContent='';go.disabled=true;go.textContent='Translating...';
try{const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.getElementById('text').value,target:document.getElementById('target').value,source:document.getElementById('source').value,engine:document.getElementById('engine').value})});
const d=await r.json();if(!d.ok)throw new Error(d.error||'failed');out.textContent=d.translation}catch(e){err.textContent=e.message}
go.disabled=false;go.textContent='Translate'};
</script>
</body>
</html>
